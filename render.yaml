services:
  - type: web
    name: n8n-general
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # ---- Networking / public URL ----
      # Render injects $PORT for the public listener. n8n listens on N8N_PORT.
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_HOST
        value: "0.0.0.0"
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false

      # ---- Database: set MANUALLY in Render's Environment tab per instance ----
      # Each n8n instance MUST get its OWN Supabase project so workflows don't
      # mix between instances. Do NOT hardcode DB values here — add them manually:
      #   DB_TYPE=postgresdb
      #   DB_POSTGRESDB_HOST=aws-0-<region>.pooler.supabase.com
      #   DB_POSTGRESDB_PORT=6543
      #   DB_POSTGRESDB_DATABASE=postgres
      #   DB_POSTGRESDB_USER=postgres.<project-ref>
      #   DB_POSTGRESDB_PASSWORD=<that project's password>
      #   DB_POSTGRESDB_SCHEMA=public
      #   DB_POSTGRESDB_SSL_ENABLED=true
      #   DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=false
      # Also add your 3 secrets (unique per instance — never share across n8ns):
      #   N8N_ENCRYPTION_KEY=<random 64 hex chars>
      #   N8N_USER_MANAGEMENT_JWT_SECRET=<random string>
      #   N8N_USER_MANAGEMENT_JWT_ENCRYPTION_KEY=<random string>
      - key: GENERIC_TIMEZONE
        value: "Africa/Lagos"

      # ---- Reduced footprint / hardening ----
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"

      # ---- Render platform ----
      - key: RENDER
        value: "true"

      # ---- Force IPv4 (Render free tier lacks IPv6 support) ----
      - key: NODE_OPTIONS
        value: "--dns-result-order=ipv4first"
